name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm Numarası (örn: 0.2.1)'
        required: true
        default: '0.2.1'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Extract Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          } elseif ("${{ github.event.inputs.version }}" -ne "") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "0.2.1"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            throw "ISCC.exe bulunamadı!"
          }
          Write-Host "Kullanılan ISCC: $iscc"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "installer\nocturne.iss"

      - name: Create GitHub Release & Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Nocturne v${{ steps.ver.outputs.version }}
          files: dist\Nocturne-Setup-v${{ steps.ver.outputs.version }}-win64.exe
          draft: false
          prerelease: false
          body: |
            ## Nocturne v${{ steps.ver.outputs.version }}

            ### 🇬🇧 English — What's New
            - **Synced Lyrics Drawer (`Ctrl + L`):** Added a real-time time-synced (LRC) and plain lyrics panel with active line highlighting, manual refresh, and click-to-seek jumping.
            - **Full Library & Playlist Management:** Create and delete playlists directly in-app, add or remove tracks from playlists, and toggle Loved Tracks with instant heart sync.
            - **Artist & Album Views + History Navigation:** Clickable artist and album links with browser-style Back/Forward navigation (`Alt + Left/Right` and mouse side buttons).
            - **Enhanced Search & Queue Controls:** Persistent search history chips, clipboard shortcuts (`Ctrl+V` / `C` / `X`), paginated search loading, shuffle/repeat modes, and queue item management.
            - **Faster Last.fm Authentication:** Optimized the Last.fm connection and authorization flow so the login screen opens much faster than before.
            - **Audio Engine & Volume Polish:** Smooth draggable volume slider with mute toggle (`M`), `+`/`-` volume shortcuts, and automatic EQ re-application on track changes.

            #### Installation (Windows)
            1. Download **`Nocturne-Setup-v${{ steps.ver.outputs.version }}-win64.exe`** from the **Assets** section below.
            2. Run the setup wizard to install or update Nocturne (`v${{ steps.ver.outputs.version }}`).
            3. Launch Nocturne and click **Deezer Session** in the top bar to sign in.

            ---

            ### 🇹🇷 Türkçe — Yenilikler
            - **Senkronize Şarkı Sözleri Paneli (`Ctrl + L`):** Aktif satır vurgulaması, manuel yenileme ve satıra tıklayarak şarkıda o saniyeye atlama özellikli zaman senkronlu (LRC) / düz söz paneli eklendi.
            - **Tam Kitaplık & Çalma Listesi Yönetimi:** Uygulama içinden yeni çalma listesi oluşturma, liste silme, listeye şarkı ekleme/çıkarma ve Beğenilen Şarkılar senkronizasyonu eklendi.
            - **Sanatçı & Albüm Görünümleri + Gezinme Geçmişi:** Tıklanabilir sanatçı/albüm bağlantıları ve fare yan tuşlarını da destekleyen İleri/Geri gezinme geçmişi (`Alt + Sol/Sağ`) eklendi.
            - **Gelişmiş Arama & Çalma Sırası Kontrolleri:** Kalıcı arama geçmişi kısayolları, pano desteği (`Ctrl+V` / `C` / `X`), sayfalı arama yükleme, karıştır/tekrar modları ve sıra düzenleme özellikleri eklendi.
            - **Daha Hızlı Last.fm Bağlantı Ekranı:** Last.fm yetkilendirme ve bağlantı akışı iyileştirilerek giriş ekranının öncekine göre çok daha hızlı açılması sağlandı.
            - **Ses Motoru & Ses Kontrolü İyileştirmeleri:** Sürüklenebilir ses çubuğu, sessize alma (`M`), `+`/`-` ses kısayolları ve parça geçişlerinde otomatik EQ tazeleme eklendi.

            #### Kurulum (Windows)
            1. Aşağıdaki **Assets** bölümünden **`Nocturne-Setup-v${{ steps.ver.outputs.version }}-win64.exe`** kurulum dosyasını indirin.
            2. Kurulum sihirbazını çalıştırarak Nocturne **`v${{ steps.ver.outputs.version }}`** sürümünü kurun veya güncelleyin.
            3. Uygulamayı başlatıp sağ üstteki **Deezer Oturumu** butonundan hesabınıza giriş yapın.

            ---
            ### Changelog / Değişiklik Geçmişi
          generate_release_notes: true